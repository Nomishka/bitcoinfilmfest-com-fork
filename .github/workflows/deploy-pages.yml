name: Deploy Jekyll site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require a dated website changelog entry
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: python3 scripts/check-changelog.py --base "${{ github.event.before }}" --head "${{ github.sha }}"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          # Matches the locally verified RubyInstaller toolchain.
          ruby-version: "3.3"
          # Dependencies are installed explicitly below into runner.temp.
          bundler-cache: false
          working-directory: site

      - name: Install Ruby dependencies
        working-directory: site
        # Keep downloaded gems outside site/. Jekyll 3.10 otherwise scans a
        # Bundler template under site/vendor/ as if it were a site post.
        run: |
          bundle config set --local path "$RUNNER_TEMP/bff-bundle"
          bundle install

      - name: Build Jekyll site
        working-directory: site
        run: bundle exec jekyll build --trace --config _config.yml,_config.github-pages.yml

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
