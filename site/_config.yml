# Bitcoin FilmFest — Jekyll site config
# Equivalent to the old inc/config.php constants (SITE_NAME, NAV, FOOTER_LINKS, SOCIAL).

title: "Bitcoin FilmFest"
tagline: "at the 🧡 of Bitcoin Cinema"
version: "0.4.0"
description: "Orange-pill cinema, unfiat the culture. BFF'27 — June 24–27, 2027, Warsaw."
url: "https://bitcoinfilmfest.com"
baseurl: ""
lang: "en"
locale: "en_US"
social_image: "/assets/images/social/bff-social-default.jpg"
logo: "/assets/images/brand/bff-logo-mark-white.png"
twitter:
  username: "bitcoinfilmfest"

contact_email: "hello@bitcoinfilmfest.com"

# Shared menu and footer links live in _data/navigation.yml so collaborators
# can edit structure without touching layout markup or site metadata.

social:
  x: "https://x.com/bitcoinfilmfest"
  instagram: "https://instagram.com/bitcoin_filmfest"
  telegram: "https://telegram.bitcoinfilmfest.com"
  github: "https://github.com/itstomekk/bitcoinfilmfest-com"
  linkedin: "https://linkedin.com/company/bitcoin-filmfest"

# Nostr npub for the DM-based subscribe form (see assets/js/subscribe.js)
nostr_npub: "npub1rjtrs7xqdvj3588r9njrexh2n750j7jdwx9qs543nutmdsj6ljaqpfmp8a"

# Jekyll's native blog engine — used for newsletters/digest posts
# films/companies: the /cinema/ ecosystem section (see PLAN-CINEMA.md). Each
# entry is one Markdown file with front matter — no build-time importer from
# the private research KB; a curator hand-writes/reviews every file that lands
# here, per the plan's data-source boundary.
collections:
  newsletters:
    output: true
    permalink: /:collection/:name/
  chronicle:
    output: false
    sort_by: date
  films:
    output: true
    permalink: /cinema/films/:name/
    sort_by: title
  companies:
    output: true
    permalink: /cinema/companies/:name/
    sort_by: title

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
      image: "/assets/images/social/bff-social-default.jpg"
  - scope:
      path: ""
      type: "newsletters"
    values:
      layout: "newsletter"
      nav_label: "Reel"
      screen: "paper"
      image: "/assets/images/social/bff-social-default.jpg"
  - scope:
      path: ""
      type: "films"
    values:
      layout: "film"
      nav_label: "Films"
      screen: "paper"
      image: "/assets/images/social/bff-social-default.jpg"
  - scope:
      path: ""
      type: "companies"
    values:
      layout: "company"
      nav_label: "Companies"
      screen: "paper"
      image: "/assets/images/social/bff-social-default.jpg"

markdown: kramdown
kramdown:
  input: GFM

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

exclude:
  - README.md
  - design.md
  - _cinema-schema.md
  - SITEMAP-PLAN.md
  - .hallmark
  - Gemfile
  - Gemfile.lock
  - node_modules
