<!DOCTYPE html>
<!--
  Shared cinema shell. All normal pages render inside data-page-main so main.js
  can swap only page content during same-origin navigation. Keep nav, bezel,
  footer, seats, and route-status outside that target: they must persist.
-->
<html lang="en">
<head>
{% include head-meta.html %}
</head>
<body data-nostr-npub="{{ site.nostr_npub }}" data-current-route="{{ page.url | default: '/' }}">

<a class="skip-link" href="#main-content">Skip to content</a>

{% include nav.html %}
<div class="screen-bezel" aria-hidden="true"></div>

<main class="stage stage--{{ page.screen | default: 'paper' }}" id="main-content" data-page-main tabindex="-1">
  <div class="screen-canvas">
    <!-- Contained film projection texture. It belongs only inside this screen,
         never on the persistent navigation, room frame, footer, or seat layer. -->
    <div class="cinema-atmosphere" aria-hidden="true">
      <i class="cinema-grain"></i>
      <i class="cinema-scratch cinema-scratch--one"></i>
      <i class="cinema-scratch cinema-scratch--two"></i>
      <i class="cinema-scratch cinema-scratch--three"></i>
      <i class="cinema-scratch cinema-scratch--four"></i>
      <i class="cinema-scratch cinema-scratch--five"></i>
      <i class="cinema-dust cinema-dust--one"></i>
      <i class="cinema-dust cinema-dust--two"></i>
      <i class="cinema-dust cinema-dust--three"></i>
      <i class="cinema-flicker"></i>
      <i class="cinema-tint"></i>
      <i class="cinema-vignette"></i>
      <i class="cinema-sprocket cinema-sprocket--left"></i>
      <i class="cinema-sprocket cinema-sprocket--right"></i>
    </div>
    <div class="inner">
      {{ content }}
    </div>
  </div>
</main>

{% unless page.screen == 'credits' %}
<!-- Footer is separate from page-swapped content, but visually remains inside the cinema screen. -->
{% include footer.html %}
{% endunless %}

<img class="cinema-seats" src="{{ '/assets/images/cinema-seats.png' | relative_url }}" width="2322" height="202" alt="" aria-hidden="true">
<div class="sr-only" id="route-status" aria-live="polite" aria-atomic="true"></div>

<script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
<script src="{{ '/assets/js/credits-roll.js' | relative_url }}" defer></script>
<script src="{{ '/assets/js/subscribe.js' | relative_url }}" defer></script>
<script src="{{ '/assets/js/cinema-browser.js' | relative_url }}" defer></script>
</body>
</html>
