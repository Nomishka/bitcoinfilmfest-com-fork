<!doctype html><html><head><style>:root {
    color-scheme: dark;
    --room: oklch(7% 0.005 245);
    --room-raised: oklch(11% 0.007 245);
    --rule: oklch(27% 0.012 245);
    --paper: oklch(95.5% 0.022 92.5);
    --ink: oklch(20.4% 0.003 248);
    --screen: oklch(62.8% 0.152 243);
    --screen-deep: oklch(48% 0.14 250);
    --accent: oklch(77.5% 0.169 65.8);
    --on-screen: oklch(98% 0.01 92);
    --muted: oklch(72% 0.02 240);
    --font-display: "Syne Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
    --font-body: "Courier Prime", "Courier New", ui-monospace, monospace;
    --bar-h: 52px;
    --side: clamp(12px, 4vw, 72px);
    --bottom: clamp(88px, 12vh, 136px);
    --frame-op: 1;
    --fy: 0px;
    --mx: 0;
  }
  html { background: var(--room); }
  body {
    margin: 0;
    background: var(--room);
    color: var(--on-screen);
    font-family: var(--font-body);
    font-size: 17px;
    line-height: 1.6;
    overflow-x: clip;
  }
  * { box-sizing: border-box; }

  /* Room frame: the dark auditorium around the screen, as on the live site. */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 2;
    border-top: var(--bar-h) solid var(--room);
    border-left: var(--side) solid var(--room);
    border-right: var(--side) solid var(--room);
    border-bottom: var(--bottom) solid var(--room);
    opacity: var(--frame-op);
    pointer-events: none;
  }

    .row {
    position: absolute;
    left: 0;
    top: 0;
    display: flex;
    align-items: flex-end;
    gap: var(--arm);
    font-size: calc(var(--sw) / 10);
    transform-origin: 50% 100%;
    will-change: transform;
  }
  /* Solid backing under the seat bases and aisles, so the screen never shows
     through a row. */
  .row::before {
    content: "";
    position: absolute;
    inset: 42% 0 0 0;
    z-index: -1;
    background: linear-gradient(180deg, oklch(12% 0.012 258), oklch(6% 0.005 250));
  }
  .seat { position: relative; display: block; flex: none; width: var(--sw); height: calc(var(--sw) * 0.92); isolation: isolate; }
  .seat::before {
    content: "";
    position: absolute;
    inset: 0 2% 16% 2%;
    z-index: 1;
    border-radius: 42% 42% 10% 10% / 30% 30% 8% 8%;
    background:
      linear-gradient(180deg, oklch(47% 0.05 258) 0%, oklch(33% 0.045 258) 20%, oklch(22% 0.03 258) 60%, oklch(13% 0.015 258) 100%);
    box-shadow: inset 0 0.14em 0 oklch(100% 0 0 / 0.14), inset 0 -1.2em 1.4em oklch(0% 0 0 / 0.55);
  }
  /* The armrest lives in the gap to the left of each seat; the gap width is
     the Arms setting (--arm). */
  .seat::after {
    content: "";
    position: absolute;
    left: calc(var(--arm) * -1);
    bottom: 0;
    width: var(--arm);
    height: 40%;
    z-index: 2;
    border-radius: 0.35em 0.35em 0 0;
    background: linear-gradient(180deg, oklch(38% 0.035 258), oklch(14% 0.01 258));
  }
  .aisle { position: relative; flex: none; width: calc(var(--sw) * 0.6); height: calc(var(--sw) * 0.92); }
  .aisle i {
    position: absolute;
    bottom: 10%;
    left: 50%;
    width: 1em;
    height: 0.35em;
    margin-left: -0.5em;
    border-radius: 0.2em;
    background: var(--accent);
    box-shadow: 0 0 1.4em 0.35em oklch(77.5% 0.169 65.8 / 0.55);
  }


html,body{background:transparent!important;margin:0}
.row{position:relative;display:inline-flex;width:max-content;transform:none;will-change:auto;padding-top:calc(var(--sw)*0.75)}
body::before{display:none}
</style></head><body><div id=w></div><script>
function occ(i,j){return false}
window.make=function(n,i,rab,sw){var h='';for(var j=0;j<n;j++){var o=occ(i,j)||j===rab;h+='<span class="seat">'+(o?'<i class="head'+(j===rab?' rabbit':'')+'"></i>':'')+'</span>'}
var w=document.getElementById('w');w.innerHTML='<div class=row id=r style="--sw:'+sw+'px;--arm:'+Math.round(sw*0.18)+'px">'+h+'</div>';}
</script></body></html>
